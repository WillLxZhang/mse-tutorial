name: Content checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install site dependencies
        run: pip install -r requirements.txt

      # 审核自动化模块尚未迁移；先确保每个 PR 都能严格构建网站。
      - name: Build site strictly
        run: mkdocs build --strict
