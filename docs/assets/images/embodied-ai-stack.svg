<path d="M 230 156 H 257" class="arrow"/>
<rect x="264" y="122" width="178" height="69" rx="9" fill="#e9f0f7"/>
<text x="353" y="150" text-anchor="middle" class="heading">认知与决策</text>
<text x="353" y="176" text-anchor="middle" class="small">理解目标</text>
<path d="M 444 156 H 471" class="arrow"/>
<rect x="478" y="122" width="178" height="69" rx="9" fill="#e9f0f7"/>
<text x="567" y="150" text-anchor="middle" class="heading">动作与控制</text>
<text x="567" y="176" text-anchor="middle" class="small">执行动作</text>
<path d="M 658 156 H 685" class="arrow"/>
<rect x="692" y="122" width="178" height="69" rx="9" fill="#e9f0f7"/>
