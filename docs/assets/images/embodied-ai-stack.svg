<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1200" viewBox="0 0 920 1200" role="img" aria-labelledby="title desc">
<title id="title">具身智能技术栈图</title>
<desc id="desc">感知、认知与决策、动作与控制、环境变化构成循环，新观测反馈给感知。研究方向包括感知、认知、动作策略与控制、学习、交互、具身与硬件。数据、仿真与部署为这些方向提供支撑。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e89"/></marker></defs>
<style>
text {font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif; fill:#25364b;}
.heading {font-weight:700; font-size:25px;}
.body {font-size:22px;}
.small {font-size:19px; fill:#587086;}
.arrow {fill:none; stroke:#526e89; stroke-width:2.4; marker-end:url(#arrow);}
</style>
<rect width="920" height="1200" rx="18" fill="#f4f7fa"/>
<text x="34" y="49" font-size="31" font-weight="700">具身智能：先看闭环，再看分工</text>
<text x="34" y="80" class="small">以机器人拿杯子为例，沿着信息流认识各个研究方向</text>
<rect x="30" y="103" width="860" height="155" rx="13" fill="#fff" stroke="#d7e1eb"/>

