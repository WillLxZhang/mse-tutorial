<path d="M 781 193 V 229 H 139 V 195" class="arrow"/>
<rect x="331" y="214" width="258" height="28" fill="#fff"/><text x="460" y="236" text-anchor="middle" class="small">新的观测，下一轮决策</text>
<text x="34" y="297" font-size="22" font-weight="700">各个方向分别在解决什么？</text>
<rect x="30" y="317" width="420" height="192" rx="12" fill="#fff" stroke="#d7e1eb"/>
<rect x="30" y="335" width="4" height="32" rx="2" fill="#637f9b"/>
<text x="49" y="354" class="heading">01 感知</text>
<text x="49" y="380" class="small">Perception</text>
<text x="49" y="416" class="body">视觉 · 触觉 · 听觉 · 本体感知</text>
<text x="49" y="446" class="body">多模态融合 · 表征学习</text>
<text x="49" y="484" class="small">例：杯子在哪？夹稳了吗？</text>
<rect x="470" y="317" width="420" height="192" rx="12" fill="#fff" stroke="#d7e1eb"/>
<rect x="470" y="335" width="4" height="32" rx="2" fill="#637f9b"/>
<text x="489" y="354" class="heading">02 认知</text>
<text x="489" y="380" class="small">Cognition</text>
<text x="489" y="416" class="body">语义理解 · 空间推理</text>
<text x="489" y="446" class="body">世界建模 · 预测 · 任务规划</text>
<text x="489" y="484" class="small">例：先拿杯子，再放进盒子</text>
<rect x="30" y="527" width="420" height="192" rx="12" fill="#fff" stroke="#d7e1eb"/>
<rect x="30" y="545" width="4" height="32" rx="2" fill="#637f9b"/>
<text x="49" y="564" class="heading">03 动作策略与控制</text>
<text x="49" y="590" class="small">Policy &amp; Control</text>
<text x="49" y="626" class="body">动作策略 · 运动规划 · 力控制</text>
<text x="49" y="656" class="body">抓取操作 · 移动 · 自适应控制</text>
<text x="49" y="694" class="small">例：夹爪往哪动，怎样跟踪？</text>
<rect x="470" y="527" width="420" height="192" rx="12" fill="#fff" stroke="#d7e1eb"/>
<rect x="470" y="545" width="4" height="32" rx="2" fill="#637f9b"/>
<text x="489" y="564" class="heading">04 学习</text>
<text x="489" y="590" class="small">Learning</text>
<text x="489" y="626" class="body">模仿学习 · 强化学习 · 自监督</text>
<text x="489" y="656" class="body">小样本 / 元学习 · 多智能体</text>
<text x="489" y="694" class="small">例：从演示与任务反馈学动作</text>
<rect x="30" y="737" width="420" height="192" rx="12" fill="#fff" stroke="#d7e1eb"/>
<rect x="30" y="755" width="4" height="32" rx="2" fill="#637f9b"/>
<text x="49" y="774" class="heading">05 交互</text>
<text x="49" y="800" class="small">Interaction</text>
<text x="49" y="836" class="body">人机交互 · 物理交互</text>
<text x="49" y="866" class="body">社会交互 · 共享自主</text>
<text x="49" y="904" class="small">例：人选目标，机器人辅助抓取</text>
<rect x="470" y="737" width="420" height="192" rx="12" fill="#fff" stroke="#d7e1eb"/>
<rect x="470" y="755" width="4" height="32" rx="2" fill="#637f9b"/>
<text x="489" y="774" class="heading">06 具身与硬件</text>
<text x="489" y="800" class="small">Embodiment &amp; Hardware</text>
<text x="489" y="836" class="body">形态设计 · 执行器 · 传感器</text>
<text x="489" y="866" class="body">能源系统 · 软体机器人</text>
<text x="489" y="904" class="small">例：身体的结构决定怎样做事</text>
<text x="34" y="978" font-size="22" font-weight="700">把系统做出来，还需要这些支撑</text>
<rect x="30" y="998" width="272" height="128" rx="12" fill="#e7eef5"/>
<text x="47" y="1033" class="heading">数据与训练</text>
<text x="47" y="1070" class="small">采集、标注与对齐</text>
<text x="47" y="1100" class="small">数据集 · PyTorch</text>
<rect x="324" y="998" width="272" height="128" rx="12" fill="#e7eef5"/>
<text x="341" y="1033" class="heading">仿真与评测</text>
<text x="341" y="1070" class="small">环境、接触与任务</text>
<text x="341" y="1100" class="small">物理仿真 · MuJoCo</text>
<rect x="618" y="998" width="272" height="128" rx="12" fill="#e7eef5"/>
<text x="635" y="1033" class="heading">部署与集成</text>
<text x="635" y="1070" class="small">通信、坐标与频率</text>
<text x="635" y="1100" class="small">机器人接口 · ROS 2</text>
<text x="34" y="1168" class="small">按研究问题整理；一个模型或项目可以同时涉及多个方向。</text></svg>
