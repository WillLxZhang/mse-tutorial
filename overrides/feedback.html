{% extends "main.html" %}

{% block content %}
  {{ super() }}
  <div class="article-box feedback-card">
    <form id="feedback-form"
          data-access-key="{{ config.extra.feedback_access_key | default('') | e }}"
          data-endpoint="{{ config.extra.feedback_endpoint | default('https://api.web3forms.com/submit') | e }}">
      <div class="feedback-input">
        <textarea id="feedback-message" name="message" rows="9" maxlength="1000" required
                  aria-label="留言" aria-describedby="feedback-count"
                  placeholder="在这里留言"></textarea>
        <p id="feedback-count" class="feedback-count" aria-live="polite">0/1000 字</p>
      </div>
      <input type="checkbox" name="botcheck" class="feedback-honeypot" tabindex="-1" aria-hidden="true">
      <div class="feedback-actions">
        <button type="submit" class="feedback-submit" disabled>提交</button>
      </div>
      <p id="feedback-status" class="feedback-status" role="status" aria-live="polite" tabindex="-1"></p>
      <noscript><p>请启用 JavaScript 后提交留言。</p></noscript>
    </form>
  </div>
  <blockquote>
    <p>ps：管理员每一条消息都会亲自看，请大家不要发送和网站无关的内容哦。</p>
  </blockquote>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script src="{{ 'assets/javascripts/feedback.js' | url }}?v=20261122-2" defer></script>
{% endblock %}
